name: Tests

on:
  pull_request:
  push:
    branches:
      - master

env:
  # routines X64_INTEL_SKYLAKE_X lacks (orglq, most single precision)
  DYNAMIC_KNOWN_FAILURES: X64_INTEL_SKYLAKE_X/example_d_lq_factorization X64_INTEL_SKYLAKE_X/example_s_lu_factorization

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-14 ]
        api: [ blas, blasfeo ]
        mf: [ cm, pm ]
        precision: [ single, double ]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - api: blasfeo
            mf: cm
            precision: double
            packalg: _packalg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: blasfeo

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          # Compiler infrastructure
          conda install cmake compilers make pkg-config
          # Dependencies
          conda install libblas liblapack
          # Python packages
          pip3 install jinja2

      - name: Run tester
        shell: bash -l {0}
        working-directory: tests
        run: python3 tester.py testset_ci_${{ matrix.api }}_${{ matrix.mf }}_${{ matrix.precision }}_${{ matrix.arch }}${{ matrix.packalg }}.json

  # one library bundling several targets, selected at load time; the
  # architecture group follows the compiler (native, -m32 or cross)
  dynamic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: x86
            os: ubuntu-latest
            apt: gcc-multilib
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_ASM_FLAGS=-m32
          - arch: arm64
            os: ubuntu-24.04-arm
          - arch: armv7
            os: ubuntu-latest
            apt: gcc-arm-linux-gnueabihf qemu-user
            cmake_args: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv7l -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_ASM_COMPILER=arm-linux-gnueabihf-gcc
            run: qemu-arm -L /usr/arm-linux-gnueabihf
          - arch: macos arm64
            os: macos-14
          - arch: macos x86_64
            os: macos-15-intel

    name: dynamic (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        run: cmake -S . -B build -DTARGET=DYNAMIC -DBUILD_SHARED_LIBS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run examples
        env:
          RUN: ${{ matrix.run }}
          KNOWN_FAILURES: ${{ env.DYNAMIC_KNOWN_FAILURES }}
        run: bash .github/workflows/dynamic_examples.sh

  dynamic-msys2:
    name: dynamic (windows x86_64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make git

      - name: Configure
        run: cmake -S . -B build -G "MSYS Makefiles" -DTARGET=DYNAMIC -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run examples
        env:
          KNOWN_FAILURES: ${{ env.DYNAMIC_KNOWN_FAILURES }}
        run: PATH="$PWD/build:$PATH" bash .github/workflows/dynamic_examples.sh

  # MSVC only supports TARGET=GENERIC (no assembly kernels)
  windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DTARGET=GENERIC

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run examples
        shell: bash
        run: |
          set -e
          for e in getting_started example_d_lu_factorization example_d_lq_factorization example_d_riccati_recursion example_s_lu_factorization example_s_riccati_recursion; do
            echo "::group::$e"
            ./build/examples/Release/$e.exe
            echo "::endgroup::"
          done

  # MinGW-w64 gcc: assembly kernels with the Windows x64 calling convention
  windows-msys2:
    strategy:
      fail-fast: false
      matrix:
        target: [ GENERIC, X64_INTEL_CORE, X64_INTEL_SANDY_BRIDGE, X64_INTEL_HASWELL ]

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # the mingw-w64 toolchain, not the plain gcc/cmake packages, which
          # target the msys2 POSIX emulation layer
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make git

      - name: Configure
        run: cmake -S . -B build -G "MSYS Makefiles" -DTARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run examples
        run: |
          set -e
          for e in getting_started example_d_lu_factorization example_d_lq_factorization example_d_riccati_recursion example_s_lu_factorization example_s_riccati_recursion; do
            echo "::group::$e"
            ./build/examples/$e.exe
            echo "::endgroup::"
          done


name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-14 ]
        api: [ blas, blasfeo ]
        mf: [ cm, pm ]
        precision: [ single, double ]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - api: blasfeo
            mf: cm
            precision: double
            packalg: _packalg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          activate-environment: blasfeo

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          # Compiler infrastructure
          conda install cmake compilers make pkg-config
          # Dependencies
          conda install libblas liblapack
          # Python packages
          pip3 install jinja2

      - name: Run tester
        shell: bash -l {0}
        working-directory: tests
        run: python3 tester.py testset_ci_${{ matrix.api }}_${{ matrix.mf }}_${{ matrix.precision }}_${{ matrix.arch }}${{ matrix.packalg }}.json

  # MSVC only supports TARGET=GENERIC (no assembly kernels)
  windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DTARGET=GENERIC

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run examples
        shell: bash
        run: |
          set -e
          for e in getting_started example_d_lu_factorization example_d_lq_factorization example_d_riccati_recursion example_s_lu_factorization example_s_riccati_recursion; do
            echo "::group::$e"
            ./build/examples/Release/$e.exe
            echo "::endgroup::"
          done

  # MinGW-w64 gcc: assembly kernels with the Windows x64 calling convention
  windows-msys2:
    strategy:
      fail-fast: false
      matrix:
        target: [ GENERIC, X64_INTEL_CORE, X64_INTEL_SANDY_BRIDGE, X64_INTEL_HASWELL ]

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # the mingw-w64 toolchain, not the plain gcc/cmake packages, which
          # target the msys2 POSIX emulation layer
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make git

      - name: Configure
        run: cmake -S . -B build -G "MSYS Makefiles" -DTARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run examples
        run: |
          set -e
          for e in getting_started example_d_lu_factorization example_d_lq_factorization example_d_riccati_recursion example_s_lu_factorization example_s_riccati_recursion; do
            echo "::group::$e"
            ./build/examples/$e.exe
            echo "::endgroup::"
          done

